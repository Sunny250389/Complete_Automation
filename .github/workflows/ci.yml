name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies (all module extras)
        run: uv sync --locked --all-extras

      - name: Install the Playwright browser for the UI tests
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check src tests

      - name: Collect every test (no execution)
        run: uv run pytest --collect-only -q

      - name: Unit tests (offline)
        run: uv run pytest tests/unit

      - name: Integration and example tests (API local service on 127.0.0.1, database on temporary SQLite, UI in headless Chromium against a local site)
        run: uv run pytest tests/integration tests/examples
