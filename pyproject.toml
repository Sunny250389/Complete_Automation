[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complete-automation"
version = "0.1.0"
description = "Unified Python test automation framework: UI, API, database, ML and LLM evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<1",
]
database = [
    "sqlalchemy>=2.0.36,<3",
]
postgresql = [
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
]
ui = [
    "playwright>=1.64,<2",
]
llm = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
]
ml = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
]
# The older DeepEval prototype (src/complete_automation/metrics, tests/llm) only.
deepeval = [
    "deepeval>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/complete_automation"]

[tool.pytest.ini_options]
addopts = "-ra -q --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
markers = [
    "smoke: quick health checks for llm app",
    "regression: full llm evaluation sweep",
    "api: API automation tests",
    "database: database testing module tests",
    "ml: ML model evaluation tests (need the ml extra: numpy, pandas, scikit-learn)",
    "ui: UI automation tests (Playwright; need the ui extra and an installed browser)",
    "postgresql: need a configured PostgreSQL server; skipped otherwise",
    "llm_evaluation: LLM evaluation module tests (offline unless marked llm_live; need the llm extra)",
    "llm_live: call a real Ollama model; opt-in through modules.llm_evaluation.live",
    "integration: tests that use a local service (no external network)",
    "cross_module: workflows that combine several testing modules against one local application",
    "live: tests against a real external service; opt-in through configuration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
