<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practice Site - Sign in</title>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login" novalidate>
      <p>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="off">
        <span data-testid="email-error" role="alert" class="error"></span>
      </p>
      <p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off">
        <span data-testid="password-error" role="alert" class="error"></span>
      </p>
      <p data-testid="login-error" role="alert" class="error"></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    // Fake credentials for this local practice site only. Real applications keep their credentials in
    // environment variables (see docs/ui_automation.md), never in the page or in the repository.
    var ACCOUNTS = { "ada@example.test": "practice-pass-1" };
    var form = document.getElementById("login");
    function setError(id, message) {
      document.querySelector('[data-testid="' + id + '"]').textContent = message;
    }
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var email = form.elements.email.value.trim();
      var password = form.elements.password.value;
      setError("email-error", email ? "" : "Email address is required");
      setError("password-error", password ? "" : "Password is required");
      setError("login-error", "");
      if (!email || !password) { return; }
      if (ACCOUNTS[email] !== password) {
        setError("login-error", "Email or password is incorrect");
        return;
      }
      sessionStorage.setItem("signedInAs", email);
      location.href = "account.html";
    });
  </script>
</body>
</html>
